name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compilar
        run: dotnet build PontoDoGesso.sln -c Release
      - name: Testar
        run: dotnet test PontoDoGesso.sln -c Release --no-build
